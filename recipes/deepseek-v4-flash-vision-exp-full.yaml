# Recipe: DeepSeek V4 Flash Vision Exp (native image input)
# Uses this repository's B12X image plus the Vision-Exp startup patch.

recipe_version: "1"
name: DeepSeek-V4-Flash-Vision-Exp-Full
description: vLLM serving DeepSeek-V4-Flash-Vision-Exp with native image_url support

model: /models/DeepSeek-V4-Flash-Vision-Exp
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods:
  - mods/deepseek-v4-vision-exp

post_launch:
  - examples/warmup-deepseek-v4-prefill.sh

defaults:
  port: 8888
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.835
  max_model_len: 500000
  block_size: 256
  max_num_seqs: 6
  max_num_batched_tokens: 4096
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 6
  long_prefill_token_threshold: 2048

env:
  DEEPSEEK_VISION_MODEL_PATH: "/models/DeepSeek-V4-Flash-Vision-Exp"
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "0"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOE_SKIP_PADDING: "0"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve /models/DeepSeek-V4-Flash-Vision-Exp \
      --served-model-name deepseek-v4-flash-vision-exp \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-prompt-tokens-details \
      --async-scheduling \
      --enable-chunked-prefill \
      --tokenizer-mode deepseek_v4 \
      --limit-mm-per-prompt '{{"image":30}}' \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}}' \
      --default-chat-template-kwargs '{{"thinking":true,"reasoning_effort":"max"}}' \
      --generation-config vllm \
      --kv-cache-dtype fp8 \
      --load-format instanttensor \
      --long-prefill-token-threshold {long_prefill_token_threshold} \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'
